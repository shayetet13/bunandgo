# Unknown hostnames do not receive the dashboard or an open redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP is retained only for the real hostname and ACME renewal.
server {
    listen 80;
    listen [::]:80;
    server_name dakotabot.site www.dakotabot.site;

    location /.well-known/acme-challenge/ {
        root /var/www/linebot;
    }

    location / {
        return 301 https://dakotabot.site$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dakotabot.site www.dakotabot.site;

    ssl_certificate /etc/letsencrypt/live/dakotabot.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dakotabot.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    autoindex off;
    client_max_body_size 64k;

    include /etc/nginx/snippets/linebot-security-headers.conf;

    root /var/www/linebot;
    index index.html;

    # Internal control-plane routes must never fall through to the SPA's
    # index.html response.
    location ^~ /internal/ { return 404; }
    location ~* ^/(?:backend|frontend|deploy)(?:/|$) { return 404; }

    # Classic scanner/attacker bait: dotfiles, source maps, key material, and
    # well-known vulnerability-probe paths (WordPress, phpMyAdmin, Spring
    # actuator, webshell filenames, router exploit probes, etc). None of
    # these exist in this app, so a hit here is always a probe, never a real
    # user — serve the deterrent/warning page instead of a bare 404. This is
    # a static file served by Nginx on Server 1; it never reaches Server 2
    # or any bot process, so it cannot add latency to bot traffic.
    location ~ /\.(?!well-known) { try_files $uri /trap/index.html; }
    location ~* \.(?:env|db|sqlite|sqlite3|map|pem|key|crt|log|bak|sql)$ { try_files $uri /trap/index.html; }
    location ~* ^/(?:wp-login\.php|wp-admin(?:/.*)?|wp-content(?:/.*)?|wp-includes(?:/.*)?|xmlrpc\.php|phpmyadmin(?:/.*)?|pma(?:/.*)?|myadmin(?:/.*)?|adminer\.php|adminer(?:/.*)?|config\.php|configuration\.php|settings\.php|actuator(?:/.*)?|cgi-bin(?:/.*)?|server-status|server-info|telescope(?:/.*)?|_profiler(?:/.*)?|HNAP1|boaform(?:/.*)?|geoserver(?:/.*)?|solr(?:/.*)?|vendor/phpunit(?:/.*)?|shell\.php|cmd\.php|webshell\.php|c99\.php|r57\.php)$ {
        try_files $uri /trap/index.html;
    }

    # The deterrent page itself. CSP is relaxed only for this one location,
    # scoped to exactly what it needs client-side: a geo-IP lookup and an
    # embedded OpenStreetMap iframe. Every other route keeps the strict
    # default-src 'self' policy from the snippet above untouched.
    #
    # Nginx does not merge add_header across levels: once a location defines
    # any add_header of its own, it stops inheriting the parent's entirely
    # (and simply appending a second Content-Security-Policy header here
    # would not replace the snippet's — browsers intersect duplicate CSP
    # headers, which would silently cancel this relaxation). So every header
    # the snippet normally sets is repeated here on purpose.
    location = /trap/index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://ipapi.co; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://linebot_backend_server2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://linebot_backend_server2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Vite fingerprints production assets, so these can be cached without
    # making a newly deployed index.html point at stale code.
    location ~* ^/assets/.+\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/linebot-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Unknown hostnames do not receive the dashboard or an open redirect.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# HTTP is retained only for the real hostname and ACME renewal.
server {
    listen 80;
    listen [::]:80;
    server_name dakotabot.site www.dakotabot.site;

    location /.well-known/acme-challenge/ {
        root /var/www/linebot;
    }

    location / {
        return 301 https://dakotabot.site$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dakotabot.site www.dakotabot.site;

    ssl_certificate /etc/letsencrypt/live/dakotabot.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dakotabot.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    autoindex off;
    client_max_body_size 64k;

	# Methods browsers and this JSON API never need are sent to the internal
	# security collector, which preserves a 405 response while alerting out of
	# band. 413 follows the same path for bodies Nginx rejects before proxying.
	error_page 419 = @security_method_probe;
	error_page 413 = @security_oversized_probe;
	if ($request_method ~* ^(?:CONNECT|TRACE|TRACK|PROPFIND|COPY|MOVE)$) { return 419; }

    include /etc/nginx/snippets/linebot-security-headers.conf;

    root /var/www/linebot;
    index index.html;

    # Internal control-plane routes, dotfiles, source maps, databases and key
    # material must never fall through to the SPA's index.html response.
    location ^~ /internal/ {
		set $linebot_probe_path $uri;
		set $linebot_probe_reason internal_path;
		error_page 418 = @security_probe;
		return 418;
	}
    location ~* ^/(?:backend|frontend|deploy)(?:/|$) {
		set $linebot_probe_path $uri;
		set $linebot_probe_reason source_path;
		error_page 418 = @security_probe;
		return 418;
	}
    location ~ /\.(?!well-known) {
		set $linebot_probe_path $uri;
		set $linebot_probe_reason dotfile;
		error_page 418 = @security_probe;
		return 418;
	}
    location ~* \.(?:env|db|sqlite|sqlite3|map|pem|key|crt|log|bak|sql)$ {
		set $linebot_probe_path $uri;
		set $linebot_probe_reason secret_file;
		error_page 418 = @security_probe;
		return 418;
	}

	# Named/internal only: an Internet client cannot address these locations.
	# Rewrite inside the named location because proxy_pass must not contain a
	# URI component there. Only safe metadata is forwarded — never body,
	# cookies, authorization headers or query parameters.
	location @security_probe {
		internal;
		rewrite ^ /internal/security-probe break;
		proxy_pass http://linebot_backend_server2;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Cookie "";
		proxy_set_header Authorization "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Linebot-Original-Path $linebot_probe_path;
		proxy_set_header X-Linebot-Security-Reason $linebot_probe_reason;
	}

	location @security_method_probe {
		internal;
		set $linebot_probe_path $uri;
		rewrite ^ /internal/security-probe break;
		proxy_pass http://linebot_backend_server2;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Cookie "";
		proxy_set_header Authorization "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Linebot-Original-Path $linebot_probe_path;
		proxy_set_header X-Linebot-Security-Reason method;
	}

	location @security_oversized_probe {
		internal;
		set $linebot_probe_path $uri;
		rewrite ^ /internal/security-probe break;
		proxy_pass http://linebot_backend_server2;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Cookie "";
		proxy_set_header Authorization "";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Linebot-Original-Path $linebot_probe_path;
		proxy_set_header X-Linebot-Security-Reason oversized;
	}

    location /api/ {
        proxy_pass http://linebot_backend_server2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://linebot_backend_server2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Vite fingerprints production assets, so these can be cached without
    # making a newly deployed index.html point at stale code.
    location ~* ^/assets/.+\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/linebot-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
